<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="./manifest.json" />
  <title>PulseFeed — Breaking News, Trending &amp; Football</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-hover: #1c222b;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #3fb950;
      --accent-dark: #238636;
      --blue: #58a6ff;
      --breaking: #f85149;
      --trending: #f0883e;
      --gumroad: #ff90e8;
      --gumroad-dark: #e06fd0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.48;
      padding: 14px;
    }
    .container { max-width: 660px; margin: 0 auto; }

    /* Top Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 0 12px;
      margin-bottom: 14px;
    }
    .topbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--breaking);
      box-shadow: 0 0 0 4px rgba(248, 81, 73, 0.22);
    }
    .nav-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav-chip {
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .nav-chip:hover { border-color: var(--blue); }
    .nav-chip-promo {
      background: rgba(255, 144, 232, 0.14);
      border-color: var(--gumroad);
      color: var(--gumroad);
    }

    /* X-Style Lane Tabs & Region Pills */
    .lane-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .lane-tabs::-webkit-scrollbar { display: none; }
    .lane-tab {
      flex: 0 0 auto;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lane-tab:hover { color: #ffffff; border-color: #484f58; }
    .lane-tab.active {
      background: #ffffff;
      color: #0d1117;
      border-color: #ffffff;
    }

    .region-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      margin-top: 8px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .region-bar::-webkit-scrollbar { display: none; }
    .region-label {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .region-pill {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #11161d;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }
    .region-pill:hover { color: #ffffff; border-color: var(--blue); }
    .region-pill.active {
      background: rgba(88, 166, 255, 0.18);
      color: #ffffff;
      border-color: var(--blue);
    }

    /* Monetized Top Spotlight Strip */
    .spotlight-bar {
      background: linear-gradient(145deg, #1b1629 0%, var(--card) 100%);
      border: 1px solid rgba(255, 144, 232, 0.55);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .spotlight-text { flex: 1; min-width: 210px; }
    .spotlight-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gumroad);
      display: block;
      margin-bottom: 2px;
    }
    .spotlight-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
    }
    .spotlight-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.82rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--blue); color: #061526; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-gumroad { background: var(--gumroad); color: #111111; }
    .btn-gumroad:hover { background: var(--gumroad-dark); }
    .btn-green { background: var(--accent-dark); color: #ffffff; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--blue); }

    /* Search */
    .search-input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.88rem;
      margin-bottom: 12px;
    }
    .search-input:focus { outline: none; border-color: var(--blue); }

    /* X-Style Composer */
    .composer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .composer-top {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .composer-top input, .composer-top select {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
    }
    .composer-top input { flex: 1; min-width: 130px; }
    .composer-card input[name="title"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .composer-card textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 8px;
    }
    .composer-card input:focus, .composer-card textarea:focus, .composer-card select:focus {
      outline: none;
      border-color: var(--blue);
    }
    .composer-media-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .media-hint {
      font-size: 0.76rem;
      color: var(--muted);
    }
    .media-hint.required { color: var(--trending); font-weight: 600; }
    .composer-preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: #000000;
    }

    /* Toast */
    .toast {
      display: none;
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(63, 185, 80, 0.14);
      border: 1px solid rgba(63, 185, 80, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    /* X-Style Post Card */
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      transition: background 0.15s ease;
    }
    .post-card.sponsored {
      border-color: rgba(255, 144, 232, 0.55);
      background: linear-gradient(170deg, #191624 0%, var(--card) 100%);
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .author-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #21262d;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #ffffff;
      flex-shrink: 0;
    }
    .author-meta { min-width: 0; }
    .author-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .author-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .lane-pill {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .lane-breaking { background: rgba(248, 81, 73, 0.16); color: #ff7b72; }
    .lane-trending { background: rgba(240, 136, 62, 0.16); color: #ffa657; }
    .lane-football { background: rgba(63, 185, 80, 0.16); color: #56d364; }
    .lane-community { background: rgba(88, 166, 255, 0.16); color: #79c0ff; }
    .lane-sponsored { background: rgba(255, 144, 232, 0.18); color: var(--gumroad); }

    .post-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .post-body {
      font-size: 0.92rem;
      color: #e6edf3;
      margin-bottom: 10px;
      white-space: pre-line;
    }
    .post-media {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      display: block;
      background: #000000;
    }

    /* Action Bar */
    .post-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
    }
    .action-btn {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
    }
    .action-btn:hover { color: #ffffff; border-color: var(--blue); }

    /* Comments & Nested Replies */
    .comments-drawer {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .comments-drawer.open { display: block; }
    .comment-node {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 7px;
      font-size: 0.84rem;
    }
    .comment-reply {
      margin-left: 20px;
      border-left: 2px solid var(--blue);
    }
    .comment-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      gap: 6px;
    }
    .comment-user { font-weight: 700; color: var(--blue); font-size: 0.8rem; }
    .reply-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .reply-link:hover { color: #ffffff; }
    .replying-banner {
      display: none;
      font-size: 0.76rem;
      color: var(--blue);
      background: rgba(88, 166, 255, 0.12);
      padding: 5px 9px;
      border-radius: 6px;
      margin-bottom: 6px;
      justify-content: space-between;
      align-items: center;
    }
    .replying-banner.active { display: flex; }
    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .comment-form input, .comment-form textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.84rem;
      font-family: inherit;
    }

    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="topbar">

    <input id="searchInput" class="search-input" type="search" placeholder="Search breaking news, football, trending topics, or posts..." />

    <!-- Inline X-Style Composer -->
    <section class="composer-card">
      <form id="composerForm">
        <div class="composer-top">
          <input type="text" name="author_name" placeholder="Your name or @handle" maxlength="45" />
          <select name="feed_lane" id="composerLane">

  <script>
    const CONFIG = {
      SUPABASE_URL: "https://pzaavnfswisvosgdfbgl.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_He61GsY9EO5I6Pf8D8pUZw_jgscYPNp",
      STORAGE_BUCKET: "marketplace-images",
      MAX_IMAGE_BYTES: 5 * 1024 * 1024,
      MAX_VIDEO_BYTES: 15 * 1024 * 1024,
      GUMROAD_DEFAULT: "https://chukwuma448.gumroad.com/l/dvfhm?utm_source=pulsefeed&utm_medium=inline_feed&utm_campaign=viralhook_ai&utm_content=native_card",
      REGION_STORAGE_KEY: "pulsefeed_selected_region"
    };

    const REGION_BADGE_MAP = {
      NG: "🇳🇬 Nigeria",
      UK: "🇬🇧 UK",
      US: "🇺🇸 US",
      EU: "🇪🇺 Europe",
      AU: "🇦🇺 Australia",
      GLOBAL: "🌍 Global"
    };

    function detectDefaultRegion() {
      const saved = localStorage.getItem(CONFIG.REGION_STORAGE_KEY);
      if (saved && (saved === "ALL" || REGION_BADGE_MAP[saved])) return saved;

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      if (tz === "Africa/Lagos") return "NG";
      if (tz === "Europe/London") return "UK";
      if (tz.startsWith("America/")) return "US";
      if (tz.startsWith("Australia/")) return "AU";
      if (tz.startsWith("Europe/")) return "EU";
      return "ALL";
    }

    let allPosts = [];
    let marketOffers = [];
    let commentsByPost = {};
    let openPostIds = new Set();
    let replyTargetByPost = {};
    let activeLane = "all";
    let activeRegion = detectDefaultRegion();
    let previewUrl = null;

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function timeAgo(iso) {
      if (!iso) return "just now";
      const secs = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (secs < 60) return `${secs}s`;
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h`;
      return `${Math.floor(hrs / 24)}d`;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window._tTimer);
      window._tTimer = setTimeout(() => { el.style.display = "none"; }, 2200);
    }

    async function sbFetch(path, options = {}) {
      const base = CONFIG.SUPABASE_URL.replace(/\/+$/, "");
      const res = await fetch(`${base}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: CONFIG.SUPABASE_ANON_KEY,
          Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      const text = await res.text();
      if (!res.ok) throw new Error(text || `HTTP ${res.status}`);
      return text && res.status !== 204 ? JSON.parse(text) : null;
    }

    /* Mobile-safe image loader + JPEG compressor */
    async function loadDrawableImage(file) {
      try {
        const bitmap = await createImageBitmap(file);
        return {
          source: bitmap,
          width: bitmap.width,
          height: bitmap.height,
          cleanup: () => { if (typeof bitmap.close === "function") bitmap.close(); }
        };
      } catch {
        const objectUrl = URL.createObjectURL(file);
        try {
          const img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = () => reject(new Error("Could not decode image."));
            el.src = objectUrl;
          });
          return {
            source: img,
            width: img.naturalWidth || img.width,
            height: img.naturalHeight || img.height,
            cleanup: () => URL.revokeObjectURL(objectUrl)
          };
        } catch (err) {
          URL.revokeObjectURL(objectUrl);
          throw err;
        }
      }
    }

    async function compressImage(file, maxWidth = 900, quality = 0.8) {
      const d = await loadDrawableImage(file);
      try {
        const scale = Math.min(1, maxWidth / d.width);
        const w = Math.max(1, Math.round(d.width * scale));
        const h = Math.max(1, Math.round(d.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(d.source, 0, 0, w, h);
        return await new Promise((resolve, reject) => {
          canvas.toBlob(
            (b) => (b ? resolve(b) : reject(new Error("Image compression failed."))),
            "image/jpeg",
            quality
          );
        });
      } finally {
        d.cleanup();
      }
    }

    async function uploadMediaFile(file) {
      const isVideo = file.type && file.type.startsWith("video/");
      const isImage = file.type && file.type.startsWith("image/");
      if (!isVideo && !isImage) {
        throw new Error("Select a JPG, PNG, WebP image or MP4/WebM video.");
      }
      if (isImage && file.size > CONFIG.MAX_IMAGE_BYTES) {
        throw new Error("Image must be 5 MB or smaller.");
      }
      if (isVideo && file.size > CONFIG.MAX_VIDEO_BYTES) {
        throw new Error("Video must be 15 MB or smaller.");
      }

      const bodyBlob = isVideo ? file : await compressImage(file);
      const ext = isVideo ? (file.type === "video/webm" ? "webm" : "mp4") : "jpg";
      const contentType = isVideo ? (file.type || "video/mp4") : "image/jpeg";
      const objectPath = `feed/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const base = CONFIG.SUPABASE_URL.replace(/\/+$/, "");

      const res = await fetch(`${base}/storage/v1/object/${CONFIG.STORAGE_BUCKET}/${objectPath}`, {
        method: "POST",
        headers: {
          apikey: CONFIG.SUPABASE_ANON_KEY,
          Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
          "Content-Type": contentType,
          "x-upsert": "false"
        },
        body: bodyBlob
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err || `Upload failed (${res.status})`);
      }

      return {
        media_url: `${base}/storage/v1/object/public/${CONFIG.STORAGE_BUCKET}/${objectPath}`,
        media_type: isVideo ? "video" : "image"
      };
    }

    /* Composer preview & lane validation */
    const composerLane = document.getElementById("composerLane");
    const composerRegion = document.getElementById("composerRegion");
    const mediaHint = document.getElementById("mediaHint");
    const mediaInput = document.getElementById("composerMediaInput");
    const imgPrev = document.getElementById("composerImgPreview");
    const vidPrev = document.getElementById("composerVidPreview");

    if (activeRegion !== "ALL" && REGION_BADGE_MAP[activeRegion]) {
      composerRegion.value = activeRegion;
    }

    function updateMediaHint() {
      const needsMedia = composerLane.value !== "community";
      mediaHint.textContent = needsMedia
        ? "Picture or video required for this lane"
        : "Optional for Community • Required for Breaking/Trending/Football";
      mediaHint.classList.toggle("required", needsMedia);
    }
    composerLane.addEventListener("change", updateMediaHint);
    updateMediaHint();

    function clearComposerPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      imgPrev.style.display = "none";
      imgPrev.src = "";
      vidPrev.style.display = "none";
      vidPrev.src = "";
    }

    mediaInput.addEventListener("change", () => {
      clearComposerPreview();
      const file = mediaInput.files && mediaInput.files[0];
      if (!file) return;
      previewUrl = URL.createObjectURL(file);
      if (file.type && file.type.startsWith("video/")) {
        vidPrev.src = previewUrl;
        vidPrev.style.display = "block";
      } else {
        imgPrev.src = previewUrl;
        imgPrev.style.display = "block";
      }
    });

    document.getElementById("composerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const author_name = form.author_name.value.trim() || "Member";
      const feed_lane = form.feed_lane.value;
      const region = form.region.value || "GLOBAL";
      const title = form.title.value.trim();
      const summary = form.summary.value.trim();
      const file = mediaInput.files && mediaInput.files[0] ? mediaInput.files[0] : null;

      if (feed_lane !== "community" && !file) {
        alert("Breaking News, Trending Now, and Football posts require a photo or video.");
        return;
      }

      const btn = document.getElementById("composerSubmitBtn");
      btn.disabled = true;
      btn.textContent = file ? "Uploading..." : "Posting...";

      try {
        let media_url = null;
        let media_type = "image";
        if (file) {
          const uploaded = await uploadMediaFile(file);
          media_url = uploaded.media_url;
          media_type = uploaded.media_type;
        }

        await sbFetch("feed_posts", {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({
            author_name,
            source_name: author_name,
            feed_lane,
            region,
            title,
            summary,
            media_url,
            media_type,
            is_user_post: true,
            status: "published"
          })
        });

        form.reset();
        if (activeRegion !== "ALL" && REGION_BADGE_MAP[activeRegion]) {
          composerRegion.value = activeRegion;
        }
        clearComposerPreview();
        updateMediaHint();
        showToast("✓ Posted to live timeline");
        await loadFeed();
      } catch (err) {
        alert("Could not publish post: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Post";
      }
    });

    /* Share helper */
    window.sharePost = async function(btn, title, url) {
      const shareUrl = url || window.location.href;
      const text = `${title}\n${shareUrl}`;
      if (navigator.share) {
        try {
          await navigator.share({ title, text, url: shareUrl });
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      try {
        await navigator.clipboard.writeText(text);
        const old = btn.textContent;
        btn.textContent = "✓ Copied";
        setTimeout(() => { btn.textContent = old; }, 1500);
      } catch {
        alert(text);
      }
    };

    /* Comments & Nested Replies */
    window.toggleComments = function(postId) {
      if (openPostIds.has(postId)) openPostIds.delete(postId);
      else openPostIds.add(postId);
      const drawer = document.getElementById(`drawer-${postId}`);
      if (drawer) drawer.classList.toggle("open", openPostIds.has(postId));
    };

    window.setReplyTarget = function(postId, commentId, authorName) {
      openPostIds.add(postId);
      replyTargetByPost[postId] = { commentId, authorName };
      renderTimeline();
      const input = document.querySelector(`#form-${postId} textarea`);
      if (input) {
        input.value = `@${authorName} `;
        input.focus();
      }
    };

    window.clearReplyTarget = function(postId) {
      delete replyTargetByPost[postId];
      renderTimeline();
    };

    window.submitPostComment = async function(e, postId) {
      e.preventDefault();
      const form = e.target;
      const author_name = form.author.value.trim() || "Visitor";
      const comment_text = form.text.value.trim();
      if (!comment_text) return;

      const replyTarget = replyTargetByPost[postId] || null;
      const btn = form.querySelector("button[type='submit']");
      btn.disabled = true;
      btn.textContent = "Posting...";

      try {
        await sbFetch("post_comments", {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({
            post_id: postId,
            parent_comment_id: replyTarget ? replyTarget.commentId : null,
            author_name,
            comment_text,
            status: "approved"
          })
        });
        delete replyTargetByPost[postId];
        openPostIds.add(postId);
        await loadFeed();
      } catch (err) {
        alert("Could not post reply: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Reply";
      }
    };

    function getLaneBadge(post) {
      if (post.is_sponsored || post.is_pinned) {
        return `<span class="lane-pill lane-sponsored">★ ${escapeHtml(post.sponsor_label || "Promoted")}</span>`;
      }
      if (post.feed_lane === "breaking") return `<span class="lane-pill lane-breaking">🚨 BREAKING</span>`;
      if (post.feed_lane === "trending") return `<span class="lane-pill lane-trending">🔥 TRENDING</span>`;
      if (post.feed_lane === "football") return `<span class="lane-pill lane-football">⚽ FOOTBALL</span>`;
      return `<span class="lane-pill lane-community">💬 COMMUNITY</span>`;
    }

    function renderMediaHtml(post) {
      const url = typeof post.media_url === "string" && /^https:\/\//i.test(post.media_url.trim())
        ? post.media_url.trim()
        : "";
      if (!url) return "";
      const isVid = post.media_type === "video" || /\.(mp4|webm|mov)(\?|$)/i.test(url);
      if (isVid) {
        return `<video class="post-media" src="${escapeHtml(url)}" controls playsinline preload="metadata"></video>`;
      }
      return `<img class="post-media" src="${escapeHtml(url)}" alt="${escapeHtml(post.title)}" loading="lazy" onerror="this.style.display='none'" />`;
    }

    function renderNativeOfferCard(offer) {
      const url = /^https:\/\//i.test(offer.checkout_url || "") ? offer.checkout_url.trim() : CONFIG.GUMROAD_DEFAULT;
      const img = /^https:\/\//i.test(offer.image_url || "")
        ? `<img class="post-media" src="${escapeHtml(offer.image_url.trim())}" alt="${escapeHtml(offer.title)}" loading="lazy" onerror="this.style.display='none'" />`
        : "";
      return `
        <article class="post-card sponsored">
          <div class="post-header">
            <div class="author-wrap">
              <div class="avatar">★</div>
              <div class="author-meta">
                <div class="author-name">${escapeHtml(offer.seller_name || "PulseFeed Partner")}</div>
                <div class="author-sub">Sponsored Offer • ${escapeHtml(offer.price_label || "Featured")}</div>
              </div>
            </div>
            <span class="lane-pill lane-sponsored">Promoted</span>
          </div>
          <div class="post-title">${escapeHtml(offer.title)}</div>
          <div class="post-body">${escapeHtml(offer.description)}</div>
          ${img}
          <div class="post-actions">
            <a class="btn btn-gumroad" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Buy / View Offer ↗</a>
            <a class="action-btn" href="./jobs.html">Promote Your Offer</a>
          </div>
        </article>
      `;
    }

    function renderPostCard(post) {
      const comments = commentsByPost[post.id] || [];
      const isOpen = openPostIds.has(post.id);
      const replyTarget = replyTargetByPost[post.id];
      const author = post.author_name || post.source_name || "PulseFeed";
      const initials = author.replace(/[^a-zA-Z0-9]/g, "").slice(0, 2).toUpperCase() || "PF";
      const actionUrl = post.cta_url || post.source_url || window.location.href;
      const isPromo = Boolean(post.is_sponsored || post.is_pinned);
      const regionBadge = REGION_BADGE_MAP[post.region || "GLOBAL"] || "🌍 Global";

      const topLevel = comments.filter((c) => !c.parent_comment_id);
      const byParent = {};
      for (const c of comments) {
        if (c.parent_comment_id) {
          if (!byParent[c.parent_comment_id]) byParent[c.parent_comment_id] = [];
          byParent[c.parent_comment_id].push(c);
        }
      }

      const orderedComments = [];
      for (const parent of topLevel) {
        orderedComments.push({ ...parent, isReply: false });
        for (const child of (byParent[parent.id] || [])) {
          orderedComments.push({ ...child, isReply: true });
        }
      }

      const commentsHtml = orderedComments.length
        ? orderedComments.map((c) => `
            <div class="comment-node ${c.isReply ? "comment-reply" : ""}">
              <div class="comment-top">
                <span class="comment-user">${escapeHtml(c.author_name)}</span>
                <button type="button" class="reply-link" onclick="setReplyTarget('${escapeJs(post.id)}', '${escapeJs(c.isReply ? c.parent_comment_id : c.id)}', '${escapeJs(c.author_name)}')">↩ Reply</button>
              </div>
              <div>${escapeHtml(c.comment_text)}</div>
            </div>
          `).join("")
        : `<div style="font-size:0.8rem;color:var(--muted);">No replies yet — start the conversation.</div>`;

      return `
        <article class="post-card ${isPromo ? "sponsored" : ""}">
          <div class="post-header">
            <div class="author-wrap">
              <div class="avatar">${escapeHtml(initials)}</div>
              <div class="author-meta">
                <div class="author-name">${escapeHtml(author)}</div>
                <div class="author-sub">${escapeHtml(post.source_name || "PulseFeed")} · ${escapeHtml(regionBadge)} · ${timeAgo(post.created_at)}</div>
              </div>
            </div>
            ${getLaneBadge(post)}
          </div>

          <div class="post-title">${escapeHtml(post.title)}</div>
          <div class="post-body">${escapeHtml(post.summary)}</div>
          ${renderMediaHtml(post)}

          <div class="post-actions">
            <button type="button" class="action-btn" onclick="toggleComments('${escapeJs(post.id)}')">
              💬 ${comments.length} ${comments.length === 1 ? "Reply" : "Replies"}
            </button>
            <button type="button" class="action-btn" onclick="sharePost(this, '${escapeJs(post.title)}', '${escapeJs(actionUrl)}')">
              🔁 Share
            </button>
            ${post.cta_url
              ? `<a class="btn btn-gumroad" href="${escapeHtml(post.cta_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(post.cta_label || "View Offer ↗")}</a>`
              : (post.source_url
                  ? `<a class="action-btn" href="${escapeHtml(post.source_url)}" target="_blank" rel="noopener noreferrer">↗ Source</a>`
                  : "")
            }
          </div>

          <div id="drawer-${escapeHtml(post.id)}" class="comments-drawer ${isOpen ? "open" : ""}">
            ${commentsHtml}
            <form id="form-${escapeHtml(post.id)}" class="comment-form" onsubmit="submitPostComment(event, '${escapeJs(post.id)}')">
              <div class="replying-banner ${replyTarget ? "active" : ""}">
                <span>Replying to <strong>@${replyTarget ? escapeHtml(replyTarget.authorName) : ""}</strong></span>
                <button type="button" class="reply-link" onclick="clearReplyTarget('${escapeJs(post.id)}')">✕ Cancel</button>
              </div>
              <input type="text" name="author" placeholder="Your name (optional)" maxlength="45" />
              <textarea name="text" rows="2" placeholder="Post your reply..." required maxlength="1000"></textarea>
              <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Reply</button>
            </form>
          </div>
        </article>
      `;
    }

    function sortBySelectedRegion(posts, regionCode, minLocalCount = 3) {
      if (!regionCode || regionCode === "ALL") return posts;
      const local = posts.filter((p) => (p.region || "GLOBAL") === regionCode);
      if (local.length >= minLocalCount) return local;
      const localIds = new Set(local.map((p) => p.id));
      const others = posts.filter((p) => !localIds.has(p.id));
      return [...local, ...others];
    }

    function renderTimeline() {
      const timeline = document.getElementById("timeline");
      const q = document.getElementById("searchInput").value.trim().toLowerCase();

      const laneAndSearchFiltered = allPosts.filter((p) => {
        if (activeLane !== "all" && !p.is_pinned && p.feed_lane !== activeLane) return false;
        if (!q) return true;
        return (
          (p.title || "").toLowerCase().includes(q) ||
          (p.summary || "").toLowerCase().includes(q) ||
          (p.author_name || "").toLowerCase().includes(q) ||
          (p.source_name || "").toLowerCase().includes(q) ||
          (p.region || "").toLowerCase().includes(q)
        );
      });

      const filtered = sortBySelectedRegion(laneAndSearchFiltered, activeRegion);

      if (!filtered.length && !marketOffers.length) {
        timeline.innerHTML = `<div class="status-box">No posts in this lane yet. Be the first to post above!</div>`;
        return;
      }

      const chunks = [];
      let offerIdx = 0;

      filtered.forEach((post, index) => {
        chunks.push(renderPostCard(post));
        if ((index + 1) % 4 === 0 && marketOffers.length > 0) {
          chunks.push(renderNativeOfferCard(marketOffers[offerIdx % marketOffers.length]));
          offerIdx++;
        }
      });

      if (filtered.length < 4 && marketOffers.length > 0) {
        chunks.push(renderNativeOfferCard(marketOffers[0]));
      }

      timeline.innerHTML = chunks.join("");
    }

    function syncRegionPills() {
      document.querySelectorAll("#regionBar .region-pill").forEach((pill) => {
        pill.classList.toggle("active", pill.dataset.region === activeRegion);
      });
    }

    async function loadFeed() {
      try {
        const [posts, comments, listings] = await Promise.all([
          sbFetch("feed_posts?status=eq.published&order=is_pinned.desc,created_at.desc&limit=80"),
          sbFetch("post_comments?status=eq.approved&order=created_at.asc&limit=1000"),
          sbFetch("market_listings?status=eq.published&order=created_at.desc&limit=20").catch(() => [])
        ]);

        allPosts = posts || [];
        marketOffers = listings || [];

        const grouped = {};
        for (const c of (comments || [])) {
          if (!grouped[c.post_id]) grouped[c.post_id] = [];
          grouped[c.post_id].push(c);
        }
        commentsByPost = grouped;
        renderTimeline();
      } catch (err) {
        document.getElementById("timeline").innerHTML =
          `<div class="status-box">Could not load timeline: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.querySelectorAll("#laneTabs .lane-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("#laneTabs .lane-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        activeLane = tab.dataset.lane;
        renderTimeline();
      });
    });

    document.querySelectorAll("#regionBar .region-pill").forEach((pill) => {
      pill.addEventListener("click", () => {
        activeRegion = pill.dataset.region;
        localStorage.setItem(CONFIG.REGION_STORAGE_KEY, activeRegion);
        if (activeRegion !== "ALL" && REGION_BADGE_MAP[activeRegion]) {
          composerRegion.value = activeRegion;
        }
        syncRegionPills();
        renderTimeline();
      });
    });

    document.getElementById("searchInput").addEventListener("input", renderTimeline);

    syncRegionPills();
    loadFeed();
    setInterval(loadFeed, 2 * 60 * 1000);
  </script>
</body>
</html>
